<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet Dream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.weserv.nl" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link
  rel="preload"
  as="image"
  fetchpriority="high"
  href="./img/hero/Mobile/hero-mobile.webp"
  imagesrcset="./img/hero/Mobile/hero-mobile.webp 1x, ./img/hero/Mobile/hero-mobile@2x.webp 2x"
  media="(max-width: 767px)"
>
<link
  rel="preload"
  as="image"
  fetchpriority="high"
  href="./img/hero/Desktop/hero-desktop.webp"
  imagesrcset="./img/hero/Desktop/hero-desktop.webp 1x, ./img/hero/Desktop/hero-desktop@2x.webp 2x"
  media="(min-width: 768px)"
>
  </head>
  <body>
    <load src="./partials/header.html" icon-path="img/icons.svg#logo" />

    <main>
      <load src="./partials/hero.html" />
      <load src="./partials/popular-products.html" />
      <load src="./partials/dessert-list.html" />
      <load src="./partials/about-us.html" />
      <load src="./partials/feedback.html" />
      <load src="./partials/faq-section.html" />
    </main>

    <load src="./partials/footer.html" />

    <load src="./partials/dessert-details-modal.html" />
    <load src="./partials/order-modal.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
