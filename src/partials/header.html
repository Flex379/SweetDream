<header class="header">
  <div class="container header-container">
    <a class="logo" href="./index.html" aria-label="SweetDream">
      <svg class="logo-icon" viewBox="0 0 112 48">
        <use href="/img/icons.svg#logo"></use>
      </svg>
    </a>

    <nav class="nav" aria-label="Головна навігація">
      <ul class="nav-list">
        <li>
          <a class="nav-link" href="#dessert-list">Солодощі</a>
        </li>
        <li>
          <a class="nav-link" href="#about-us">Про нас</a>
        </li>
        <li>
          <a class="nav-link" href="#feedback">Відгуки</a>
        </li>
        <li>
          <a class="nav-link" href="#faq">Часті питання</a>
        </li>
      </ul>

      <a class="button" href="#dessert-list">До покупок</a>
    </nav>

    <button
      class="burger-button"
      type="button"
      aria-label="Відкрити меню"
      aria-controls="mobile-menu"
      aria-expanded="false"
    >
      <svg class="burger-icon" width="24" height="24">
        <use href="/img/icons.svg#menu"></use>
      </svg>
    </button>
  </div>

  <nav
    class="mobile-menu"
    id="mobile-menu"
    aria-label="Мобільна навігація"
    aria-hidden="true"
    inert
  >
    <div class="container mobile-menu-container">
      <div class="mobile-menu-header">
        <a class="logo" href="./index.html" aria-label="SweetDream">
          <svg class="logo-icon" viewBox="0 0 112 48">
            <use href="/img/icons.svg#logo"></use>
          </svg>
        </a>

        <button
          class="mobile-menu-close"
          type="button"
          aria-label="Закрити меню"
        >
          <svg class="close-icon" width="24" height="24">
            <use href="/img/icons.svg#close"></use>
          </svg>
        </button>
      </div>

      <ul class="mobile-nav-list">
        <li>
          <a class="mobile-nav-link" href="#dessert-list">Солодощі</a>
        </li>
        <li>
          <a class="mobile-nav-link" href="#about-us">Про нас</a>
        </li>
        <li>
          <a class="mobile-nav-link" href="#feedback">Відгуки</a>
        </li>
        <li>
          <a class="mobile-nav-link" href="#faq">Часті питання</a>
        </li>
        <li>
          <a class="mobile-nav-button" href="#dessert-list">До покупок</a>
        </li>
      </ul>
    </div>
  </nav>
